<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandeepan TV - Zee Bangla Live</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .player-container {
            width: 100%;
            max-width: 1000px;
            text-align: center;
        }

        .channel-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .status {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 10px;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }
    </style>
</head>

<body>

<div class="player-container">

    <div class="channel-name">
    </div>

    <div id="status" class="status">
        Connecting...
    </div>

    <video id="video" controls autoplay muted playsinline></video>

</div>

<script>

const video = document.getElementById('video');
const statusText = document.getElementById('status');

const streamUrl =
    'https://tvsen6.aynaott.com/ZeeBangla/index.m3u8';

let hls = null;
let retryTimer = null;
let retryCount = 0;

const RETRY_DELAY = 5000;


function setStatus(message) {
    statusText.textContent = message;
}


/* -----------------------------
   START STREAM
------------------------------ */

function startStream() {

    clearTimeout(retryTimer);

    setStatus('Connecting to Sandeepan TV...');

    /* HLS.js browsers */

    if (Hls.isSupported()) {

        if (hls) {
            hls.destroy();
            hls = null;
        }

        hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true
        });

        hls.loadSource(streamUrl);
        hls.attachMedia(video);


        /* Manifest loaded */

        hls.on(Hls.Events.MANIFEST_PARSED, function () {

            retryCount = 0;

            setStatus('LIVE');

            video.play().catch(() => {});

        });


        /* Errors */

        hls.on(Hls.Events.ERROR, function (event, data) {

            console.log('HLS Error:', data);

            if (!data.fatal) {
                return;
            }

            setStatus('Stream unavailable — retrying...');

            console.log(
                'Fatal error:',
                data.type,
                data.details
            );


            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {

                hls.destroy();
                hls = null;

                retryStream();

            }

            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {

                console.log('Recovering media error...');

                try {
                    hls.recoverMediaError();
                }
                catch (e) {
                    retryStream();
                }

            }

            else {

                hls.destroy();
                hls = null;

                retryStream();

            }

        });

    }


    /* -----------------------------
       Native HLS (Safari/iPhone)
    ------------------------------ */

    else if (
        video.canPlayType('application/vnd.apple.mpegurl')
    ) {

        video.src = streamUrl;

        video.addEventListener(
            'loadedmetadata',
            function () {

                retryCount = 0;

                setStatus('LIVE');

                video.play().catch(() => {});

            },
            { once: true }
        );


        video.addEventListener('error', function () {

            setStatus('Stream unavailable — retrying...');

            retryStream();

        });

    }


    else {

        setStatus('HLS is not supported in this browser.');

    }

}


/* -----------------------------
   RETRY STREAM
------------------------------ */

function retryStream() {

    clearTimeout(retryTimer);

    retryCount++;

    setStatus(
        'Stream unavailable — retrying in ' +
        (RETRY_DELAY / 1000) +
        ' seconds...'
    );

    retryTimer = setTimeout(function () {

        console.log(
            'Retry attempt:',
            retryCount
        );

        startStream();

    }, RETRY_DELAY);

}


/* -----------------------------
   VIDEO ERROR
------------------------------ */

video.addEventListener('error', function () {

    console.log('Video error');

    setStatus('Stream unavailable — retrying...');

    retryStream();

});


/* -----------------------------
   START
------------------------------ */

startStream();

</script>

</body>
</html>
