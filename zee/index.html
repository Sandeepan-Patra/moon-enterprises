<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandeepan TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root{--bg:#0f1016;--panel:#181a24;--line:#2a2d3b;--text:#eceaf2;--mute:#9a9cb0;--live:#e5405e}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
button,input{font:inherit}
:focus{outline:none}
.hidden{display:none!important}

/* Passcode gate */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 24px;text-align:center}
.gate-box h1{font-size:22px;margin:0 0 6px}
.gate-box p{margin:0 0 20px;color:var(--mute);font-size:14px}
#pin{width:100%;padding:14px;text-align:center;font-size:28px;letter-spacing:12px;background:var(--bg);color:var(--text);border:2px solid var(--line);border-radius:10px}
#pin:focus{border-color:#fff}
#pinErr{min-height:20px;margin:10px 0;color:var(--live);font-size:14px}
.btn{width:100%;padding:13px;border:2px solid transparent;border-radius:10px;background:var(--live);color:#fff;font-weight:bold;cursor:pointer}
.btn:focus{border-color:#fff}

/* Channel grid */
#app{max-width:1100px;margin:0 auto;padding:28px 20px}
.top{margin-bottom:22px}
.top h1{margin:0;font-size:26px}
.hint{margin-top:6px;font-size:13px;color:var(--mute)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;padding:6px}
.card{background:var(--panel);border:3px solid var(--line);border-radius:12px;padding:0;color:var(--text);text-align:left;cursor:pointer;overflow:hidden;transition:transform .12s}
.card:focus,.card:hover{border-color:#fff;transform:scale(1.06);position:relative;z-index:1}
.thumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:bold;color:#fff}
.meta{padding:12px 14px}
.meta b{display:block;font-size:17px}
.meta span{font-size:13px;color:var(--mute)}

/* Player */
#player .bar{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.back{background:none;border:3px solid var(--line);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer}
.back:focus{border-color:#fff}
#chName{font-size:22px;font-weight:bold}
#status{font-size:14px;color:var(--mute);margin-bottom:10px}
#status.live{color:var(--live);font-weight:bold}
video{width:100%;height:auto;display:block;background:#000;border-radius:10px;border:3px solid transparent}
video:focus{border-color:#fff}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h1>Sandeepan TV</h1>
    <p>Enter the passcode to view channels</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Passcode">
    <div id="pinErr" role="alert"></div>
    <button class="btn" id="pinBtn">Unlock</button>
  </div>
</div>

<div id="app" class="hidden">
  <div id="list">
    <div class="top">
      <h1>Channels</h1>
      <div class="hint">Use the arrow keys to move, OK to watch, Back to return to this menu.</div>
    </div>
    <div id="grid"></div>
  </div>

  <div id="player" class="hidden">
    <div class="bar">
      <button class="back" id="backBtn">Back</button>
      <div id="chName"></div>
    </div>
    <div id="status">Connecting...</div>
    <video id="video" controls autoplay muted playsinline tabindex="0"></video>
  </div>
</div>

<script>
const PASSCODE = '1958';
const DEBUG = true;   // shows the last remote key at bottom-left; set to false when done

const CHANNELS = [
  { name: 'Zee Bangla', lang: 'Bengali', color: '#c2334f', url: 'https://d1rc86nwwc9fag.cloudfront.net/260723/smil:zeebangla.smil/chunklist_b2628000.m3u8' },
  { name: 'Zee Bangla-HD', lang: 'Bengali', color: '#e03131', url: 'https://tvsen6.aynaott.com/ZeeBangla/index.m3u8' },
  { name: 'Zee Bangla Sonar', lang: 'Bengali', color: '#3b5bdb', url: 'https://d1g8wgjurz8via.cloudfront.net/bpk-tv/ColorsHD/default/ColorsHD-video=2137600.m3u8' },
  { name: 'Aastha', lang: 'Bhakti', color: '#0b7a75', url: 'https://aasthaott.akamaized.net/110923/smil:aasthaprime1.smil/master.m3u8' },
  { name: 'Sanskar', lang: 'Bhakti', color: '#8a4fbf', url: 'https://d26idhjf0y1p2g.cloudfront.net/out/v1/cd66dd25b9774cb29943bab54bbf3e2f/index_20.m3u8' },
  { name: 'Aajtak', lang: 'News', color: '#d9480f', url: 'https://feeds.intoday.in/aajtak/api/aajtakhd/master.m3u8' },
  { name: 'B4U Music', lang: 'Music', color: '#7950f2', url: 'https://cdn.pishow.tv/ott/live/415/master.m3u8' },
  { name: 'Star Gold', lang: 'Movies', color: '#f08c00', url: 'http://51.75.127.199:3141/stargold/index.m3u8' },
  { name: 'Star Bharat', lang: 'Serial', color: '#e8590c', url: 'http://51.75.127.199:3141/starbharat/tracks-v1a1/mono.m3u8' },
  { name: 'Star Jalsa', lang: 'Movies', color: '#fab005', url: 'https://da86m1sqpm3o0.cloudfront.net/28072023/smil:starjalsha.smil/chunklist_b1928000.m3u8' },
  { name: 'Star Utsav Movie', lang: 'Bengali', color: '#7048e8', url: 'http://51.75.127.199:3141/starutsavmovies/index.m3u8' },
  { name: 'Star Movies', lang: 'Movies', color: '#37b24d', url: 'http://51.75.127.199:3141/starmovieshd/index.m3u8' },
  { name: 'Zee News', lang: 'News', color: '#1971c2', url: 'https://dknttpxmr0dwf.cloudfront.net/index_57.m3u8' },
  { name: 'ABP News', lang: 'News', color: '#ae3ec9', url: 'https://d1rc86nwwc9fag.cloudfront.net/vglive-sk-472500/abpnews/master.m3u8' },
  { name: 'B4U Cineplex', lang: 'Movies', color: '#2f7d32', url: 'https://streams.tangotv.in/B4UMOVIES/ORIGIN/tracks-v1a1/mono.m3u8' }
];



const $ = id => document.getElementById(id);
const video = $('video'), statusText = $('status');
const RETRY_DELAY = 5000;
let hls = null, retryTimer = null, currentUrl = null;
let unlocked = false, playerOpen = false, lastCard = null;

/* ---------- Passcode (auto-submits at 4 digits for remote use) ---------- */
function tryUnlock() {
  if ($('pin').value === PASSCODE) {
    unlocked = true;
    $('gate').classList.add('hidden');
    $('app').classList.remove('hidden');
    renderGrid();
    const first = document.querySelector('.card:not([disabled])');
    if (first) first.focus();
  } else {
    $('pinErr').textContent = 'Wrong passcode. Try again.';
    $('pin').value = '';
    $('pin').focus();
  }
}
$('pinBtn').onclick = tryUnlock;
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter' || e.keyCode === 13) tryUnlock(); });
$('pin').addEventListener('input', () => {
  $('pinErr').textContent = '';
  if ($('pin').value.length === 4) tryUnlock();
});
$('pin').focus();

/* ---------- Channel cards ---------- */
function renderGrid() {
  const grid = $('grid');
  grid.innerHTML = '';
  CHANNELS.forEach(ch => {
    const b = document.createElement('button');
    b.className = 'card';
    b.disabled = !ch.url;
    b.innerHTML =
      '<div class="thumb" style="background:' + ch.color + '">' + ch.name.charAt(0) + '</div>' +
      '<div class="meta"><b></b><span></span></div>';
    b.querySelector('b').textContent = ch.name;
    b.querySelector('span').textContent = ch.url ? ch.lang + ' \u2022 Live' : 'Not set up';
    b.onclick = () => openChannel(ch, b);
    b.addEventListener('focus', () => b.scrollIntoView({ block: 'nearest' }));
    grid.appendChild(b);
  });
}

/* ---------- Open / close player (Back goes to the menu) ---------- */
function getStreamUrl(url) {
    // HTTPS website + HTTP stream → use your HTTPS proxy
    if (location.protocol === 'https:' && url.startsWith('http://')) {
        return 'hls-proxy.php?url=' + encodeURIComponent(url);
    }

    // HTTP website / local file → use original stream
    return url;
}
function openChannel(ch, card) {
  lastCard = card;
  playerOpen = true;
  history.pushState({ player: true }, '');   // so the remote's Back returns to the menu
  $('list').classList.add('hidden');
  $('player').classList.remove('hidden');
  $('chName').textContent = ch.name;
  currentUrl = getStreamUrl(ch.url);
  startStream();
  video.focus();
}

function showMenu() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  stopStream();
  playerOpen = false;
  $('player').classList.add('hidden');
  $('list').classList.remove('hidden');
  if (lastCard) lastCard.focus();
}

function closePlayer() {
  if (history.state && history.state.player) history.back();  // popstate -> showMenu
  else showMenu();
}

window.addEventListener('popstate', () => { if (playerOpen) showMenu(); });
$('backBtn').onclick = closePlayer;

/* ---------- Remote / keyboard ---------- */
function center(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function moveFocus(dir) {
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card:not([disabled])'));
  var cur = document.activeElement && document.activeElement.classList.contains('card') ? document.activeElement : null;
  if (!cur) { if (cards[0]) cards[0].focus(); return; }
  var c = center(cur), best = null, bestScore = Infinity;
  cards.forEach(function (el) {
    if (el === cur) return;
    var p = center(el), dx = p.x - c.x, dy = p.y - c.y, main, cross;
    if (dir === 'right') { main = dx; cross = Math.abs(dy); }
    else if (dir === 'left') { main = -dx; cross = Math.abs(dy); }
    else if (dir === 'down') { main = dy; cross = Math.abs(dx); }
    else { main = -dy; cross = Math.abs(dx); }
    if (main <= 5) return;
    var score = main + cross * 2;
    if (score < bestScore) { bestScore = score; best = el; }
  });
  if (best) best.focus();
}

/* Many TV browsers only send keyCode (no e.key), so normalise both */
function keyName(e) {
  var c = e.keyCode || e.which, k = e.key;
  if (c === 37 || k === 'ArrowLeft' || k === 'Left') return 'left';
  if (c === 38 || k === 'ArrowUp' || k === 'Up') return 'up';
  if (c === 39 || k === 'ArrowRight' || k === 'Right') return 'right';
  if (c === 40 || k === 'ArrowDown' || k === 'Down') return 'down';
  if (c === 13 || c === 29443 || c === 65376 || k === 'Enter') return 'ok';
  if (c === 8 || c === 27 || c === 4 || c === 166 || c === 461 || c === 10009 ||
      k === 'Escape' || k === 'Backspace' || k === 'BrowserBack' || k === 'GoBack' || k === 'XF86Back') return 'back';
  return '';
}

/* Debug readout */
var dbg = null;
if (DEBUG) {
  dbg = document.createElement('div');
  dbg.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99;background:#000;color:#0f0;font:14px monospace;padding:4px 8px;border-radius:4px';
  dbg.textContent = 'Press a remote key...';
  document.body.appendChild(dbg);
}

function onKey(e) {
  var k = keyName(e);
  if (dbg) dbg.textContent = 'key=' + e.key + '  code=' + (e.keyCode || e.which) + '  action=' + (k || 'none');
  if (!unlocked || !k) return;                 // passcode box handles its own keys

  if (!playerOpen) {                           // MENU
    if (k === 'back') { e.preventDefault(); return; }   // stay on the menu
    if (k === 'ok') {
      var a = document.activeElement;
      if (a && a.classList.contains('card')) { e.preventDefault(); a.click(); }
      return;
    }
    e.preventDefault();
    moveFocus(k);
    return;
  }

  /* PLAYER */
  e.preventDefault();
  if (k === 'back') {
    if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
    else closePlayer();
  }
  else if (k === 'left') $('backBtn').focus();
  else if (k === 'right') video.focus();
  else if (k === 'up' || k === 'down') {
    video.muted = false;
    video.volume = Math.min(1, Math.max(0, video.volume + (k === 'up' ? 0.1 : -0.1)));
  }
  else if (k === 'ok') {
    if (document.activeElement === $('backBtn')) closePlayer();
    else if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
    else if (video.requestFullscreen) video.requestFullscreen().catch(function () {});
  }
}
window.addEventListener('keydown', onKey, true);

/* Samsung Tizen needs the Back key registered; harmless elsewhere */
try { if (window.tizen && tizen.tvinputdevice) tizen.tvinputdevice.registerKey('Back'); } catch (err) {}

/* ---------- Streaming ---------- */
function setStatus(msg, live) {
  statusText.textContent = msg;
  statusText.className = live ? 'live' : '';
}

function stopStream() {
  clearTimeout(retryTimer);
  currentUrl = null;
  if (hls) { hls.destroy(); hls = null; }
  video.onerror = null;
  video.pause();
  video.removeAttribute('src');
  video.load();
}

function retryStream() {
  clearTimeout(retryTimer);
  if (!currentUrl) return;
  setStatus('Stream unavailable \u2014 retrying in ' + (RETRY_DELAY / 1000) + ' seconds...');
  retryTimer = setTimeout(startStream, RETRY_DELAY);
}

function startStream() {
  clearTimeout(retryTimer);
  if (!currentUrl) return;
  const url = currentUrl;
  setStatus('Connecting...');

  if (window.Hls && Hls.isSupported()) {
    if (hls) { hls.destroy(); hls = null; }
    hls = new Hls({ enableWorker: true, lowLatencyMode: true });
    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      setStatus('LIVE', true);
      video.play().catch(() => {});
    });

    hls.on(Hls.Events.ERROR, (e, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        try { hls.recoverMediaError(); return; } catch (err) {}
      }
      hls.destroy(); hls = null;
      retryStream();
    });
  }
  else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.onloadedmetadata = () => { setStatus('LIVE', true); video.play().catch(() => {}); };
    video.onerror = retryStream;
  }
  else {
    setStatus('HLS is not supported in this browser.');
  }
}
</script>
</body>
</html>
